name: Validate source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.17
      - run: uv sync --frozen --extra test
      - run: uv run --frozen pytest -q
      - run: node --check jira_service/static/app.js
      - run: node --check jira_service/static/review.js
      - run: bash -n deploy/install-wsl.sh deploy/keep-alive.sh
      - run: python scripts/check_public_files.py
